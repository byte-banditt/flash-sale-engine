version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: flash_postgres
    mem_limit: 384m
    memswap_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flashsale_db"]
      interval: 5s
      timeout: 3s
      retries: 30
    environment:
      POSTGRES_DB: flashsale_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: flash_redis
    mem_limit: 384m
    memswap_limit: 384m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: flash_rabbitmq
    mem_limit: 384m
    memswap_limit: 384m
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
    ports:
      - "5672:5672"    # AMQP protocol port
      - "15672:15672"  # Web management dashboard
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  app:
    profiles: [distributed]
    build: .
    image: flash-sale-engine:local
    mem_limit: 640m
    memswap_limit: 640m
    environment:
      JAVA_TOOL_OPTIONS: -Xmx256m
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/flashsale_db
      SPRING_DATA_REDIS_HOST: redis
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  nginx:
    profiles: [distributed]
    image: nginx:1.28-alpine
    mem_limit: 64m
    memswap_limit: 64m
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:8080"
    depends_on: [app]
