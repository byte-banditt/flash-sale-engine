name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw test

  smoke-bench:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: grafana/setup-k6-action@v1
      - name: Package application image
        run: ./mvnw -DskipTests package
      - name: Start Compose services
        run: docker compose --profile distributed up -d --build --scale app=1
      - name: Run baseline smoke benchmark and invariants
        env:
          CI_BENCH: 'true'
          OUTBOX_MODE: 'true'
        run: |
          mkdir -p bench/results/ci-smoke
          python3 bench/experiment.py bench/results/ci-smoke none
          python3 bench/outbox_reconcile.py bench/results/ci-smoke | tee bench/results/ci-smoke/invariants.stdout
          python3 -c 'import json, pathlib, sys; r=json.loads(pathlib.Path("bench/results/ci-smoke/outbox-invariants.json").read_text()); keys=("lost_keys", "duplicate_keys", "stuck_pending_keys"); counts={k: len(r[k]) for k in keys}; counts["oversold_count"]=r["oversold_count"]; print(json.dumps(counts, sort_keys=True)); sys.exit(0 if r["pass"] and all(v == 0 for v in counts.values()) else 1)'
      - name: Upload benchmark output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-bench
          path: bench/results/ci-smoke/
          if-no-files-found: warn
      - name: Stop Compose services
        if: always()
        run: docker compose --profile distributed down -v
