server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never

spring:
  application:
    name: flash-sale-engine

  # PostgreSQL Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/flashsale_db
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Redis Configuration
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: flash-sale-engine
      enable-auto-commit: false
    producer:
      acks: all
      enable-idempotence: true
      delivery-timeout-ms: 10000

flashsale:
  kafka:
    orders-partitions: 3
    orders-replication-factor: 1
    delivery-timeout-ms: 10000
